<rect width="1600" height="1210" fill="#fff"/>
<text x="40" y="52" font-size="28" font-weight="700" fill="#222">Vacation-rental marketplace — production architecture</text>
<text x="40" y="80" font-size="15" fill="#6a6a6a">Read-heavy browse/search served from the edge · strongly consistent booking core · event-driven fan-out · multi-region</text>
<text x="40" y="130" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8a8a8a">CLIENTS</text>
<text x="300" y="130" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8a8a8a">EDGE</text>
<text x="590" y="130" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8a8a8a">API LAYER</text>
<text x="850" y="130" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8a8a8a">DOMAIN SERVICES  (stateless, Kubernetes + HPA)</text>
<text x="1300" y="130" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8a8a8a">DATA</text>
<text x="40" y="806" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8a8a8a">SCALING STRATEGY</text>
<rect x="288" y="140" width="274" height="340" rx="12" fill="transparent" stroke="#b8b8b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="838" y="140" width="444" height="412" rx="12" fill="transparent" stroke="#b8b8b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="40" y="150" width="220" height="92" rx="12" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="58" y="178" font-size="15" font-weight="700" fill="#222">Web (React / Next.js)</text>
<text x="58" y="200" font-size="12.5" fill="#555">SSR + ISR listing pages,</text>
<text x="58" y="218" font-size="12.5" fill="#555">client-side overlays</text>
<rect x="40" y="262" width="220" height="76" rx="12" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="58" y="290" font-size="15" font-weight="700" fill="#222">iOS / Android</text>
<text x="58" y="312" font-size="12.5" fill="#555">Same BFF, push notifications</text>
<rect x="40" y="358" width="220" height="76" rx="12" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="58" y="386" font-size="15" font-weight="700" fill="#222">Hosts &amp; internal tools</text>
<text x="58" y="408" font-size="12.5" fill="#555">Calendar, pricing, support</text>
<rect x="300" y="150" width="250" height="110" rx="12" fill="#fff4f6" stroke="#ff385c" stroke-width="1.5"/>
<text x="318" y="178" font-size="15" font-weight="700" fill="#222">Global CDN + WAF</text>
<text x="318" y="200" font-size="12.5" fill="#555">Static JS/CSS, ISR HTML (s-maxage +</text>
<text x="318" y="218" font-size="12.5" fill="#555">stale-while-revalidate), bot mgmt,</text>
<text x="318" y="236" font-size="12.5" fill="#555">DDoS / rate limits, geo-DNS</text>
<rect x="300" y="280" width="250" height="92" rx="12" fill="#fff4f6" stroke="#ff385c" stroke-width="1.5"/>
<text x="318" y="308" font-size="15" font-weight="700" fill="#222">Image CDN</text>
<text x="318" y="330" font-size="12.5" fill="#555">On-the-fly resize, AVIF/WebP,</text>
<text x="318" y="348" font-size="12.5" fill="#555">srcset widths, immutable cache</text>
<rect x="300" y="392" width="250" height="76" rx="12" fill="#fff4f6" stroke="#ff385c" stroke-width="1.5"/>
<text x="318" y="420" font-size="15" font-weight="700" fill="#222">Edge functions</text>
<text x="318" y="442" font-size="12.5" fill="#555">Locale/currency, A/B bucketing</text>
<rect x="590" y="150" width="220" height="92" rx="12" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="608" y="178" font-size="15" font-weight="700" fill="#222">Web SSR / ISR (Next.js)</text>
<text x="608" y="200" font-size="12.5" fill="#555">Renders listing HTML on a CDN</text>
<text x="608" y="218" font-size="12.5" fill="#555">miss; Node pods, autoscaled</text>
<rect x="590" y="262" width="220" height="130" rx="12" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="608" y="290" font-size="15" font-weight="700" fill="#222">API gateway / BFF</text>
<text x="608" y="312" font-size="12.5" fill="#555">GraphQL/REST per client,</text>
<text x="608" y="330" font-size="12.5" fill="#555">request fan-out, response</text>
<text x="608" y="348" font-size="12.5" fill="#555">shaping, per-user rate limits,</text>
<text x="608" y="366" font-size="12.5" fill="#555">idempotency keys on writes</text>
<rect x="590" y="412" width="220" height="70" rx="12" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="608" y="440" font-size="15" font-weight="700" fill="#222">Identity (OIDC)</text>
<text x="608" y="462" font-size="12.5" fill="#555">Sessions, JWT, MFA, KYC</text>
<rect x="850" y="150" width="200" height="84" rx="12" fill="#f3f7ff" stroke="#5b7fd6" stroke-width="1.5"/>
<text x="868" y="178" font-size="15" font-weight="700" fill="#222">Listing</text>
<text x="868" y="200" font-size="12.5" fill="#555">Details, photo metadata,</text>
<text x="868" y="218" font-size="12.5" fill="#555">amenities, host profile</text>
<rect x="1070" y="150" width="200" height="84" rx="12" fill="#f3f7ff" stroke="#5b7fd6" stroke-width="1.5"/>
<text x="1088" y="178" font-size="15" font-weight="700" fill="#222">Search &amp; ranking</text>
<text x="1088" y="200" font-size="12.5" fill="#555">Geo + date + price filters,</text>
<text x="1088" y="218" font-size="12.5" fill="#555">ML re-ranking</text>
<rect x="850" y="252" width="200" height="84" rx="12" fill="#f3f7ff" stroke="#5b7fd6" stroke-width="1.5"/>
<text x="868" y="280" font-size="15" font-weight="700" fill="#222">Availability</text>
<text x="868" y="302" font-size="12.5" fill="#555">Calendar, holds (TTL),</text>
<text x="868" y="320" font-size="12.5" fill="#555">min-stay rules, iCal sync</text>
<rect x="1070" y="252" width="200" height="84" rx="12" fill="#f3f7ff" stroke="#5b7fd6" stroke-width="1.5"/>
<text x="1088" y="280" font-size="15" font-weight="700" fill="#222">Pricing</text>
<text x="1088" y="302" font-size="12.5" fill="#555">Nightly rates, fees, taxes,</text>
<text x="1088" y="320" font-size="12.5" fill="#555">coupons, FX</text>
<rect x="850" y="354" width="200" height="84" rx="12" fill="#f3f7ff" stroke="#5b7fd6" stroke-width="1.5"/>
<text x="868" y="382" font-size="15" font-weight="700" fill="#222">Booking (saga)</text>
<text x="868" y="404" font-size="12.5" fill="#555">Hold → pay → confirm,</text>
<text x="868" y="422" font-size="12.5" fill="#555">compensations on failure</text>
<rect x="1070" y="354" width="200" height="84" rx="12" fill="#f3f7ff" stroke="#5b7fd6" stroke-width="1.5"/>
<text x="1088" y="382" font-size="15" font-weight="700" fill="#222">Payments</text>
<text x="1088" y="404" font-size="12.5" fill="#555">PSP integration, payouts,</text>
<text x="1088" y="422" font-size="12.5" fill="#555">double-entry ledger</text>
<rect x="850" y="456" width="200" height="84" rx="12" fill="#f3f7ff" stroke="#5b7fd6" stroke-width="1.5"/>
<text x="868" y="484" font-size="15" font-weight="700" fill="#222">Reviews</text>
<text x="868" y="506" font-size="12.5" fill="#555">Rating aggregates,</text>
<text x="868" y="524" font-size="12.5" fill="#555">moderation</text>
<rect x="1070" y="456" width="200" height="84" rx="12" fill="#f3f7ff" stroke="#5b7fd6" stroke-width="1.5"/>
<text x="1088" y="484" font-size="15" font-weight="700" fill="#222">Messaging &amp; notify</text>
<text x="1088" y="506" font-size="12.5" fill="#555">Host↔guest chat (WebSocket),</text>
<text x="1088" y="524" font-size="12.5" fill="#555">email / SMS / push</text>
<rect x="1300" y="150" width="260" height="104" rx="12" fill="#f2faf4" stroke="#3f9a5c" stroke-width="1.5"/>
<text x="1318" y="178" font-size="15" font-weight="700" fill="#222">PostgreSQL — listings</text>
<text x="1318" y="200" font-size="12.5" fill="#555">Sharded by listing_id,</text>
<text x="1318" y="218" font-size="12.5" fill="#555">read replicas per region</text>
<text x="1318" y="236" font-size="12.5" fill="#555">Owner: Listing</text>
<rect x="1300" y="266" width="260" height="104" rx="12" fill="#f2faf4" stroke="#3f9a5c" stroke-width="1.5"/>
<text x="1318" y="294" font-size="15" font-weight="700" fill="#222">PostgreSQL — bookings</text>
<text x="1318" y="316" font-size="12.5" fill="#555">Home-region writes; exclusion</text>
<text x="1318" y="334" font-size="12.5" fill="#555">constraint on (listing, dates)</text>
<text x="1318" y="352" font-size="12.5" fill="#555">Owner: Booking, Payments</text>
<rect x="1300" y="382" width="260" height="86" rx="12" fill="#f2faf4" stroke="#3f9a5c" stroke-width="1.5"/>
<text x="1318" y="410" font-size="15" font-weight="700" fill="#222">Redis cluster</text>
<text x="1318" y="432" font-size="12.5" fill="#555">Hot listings, holds, sessions</text>
<text x="1318" y="450" font-size="12.5" fill="#555">Used by: Availability, BFF</text>
<rect x="1300" y="480" width="260" height="86" rx="12" fill="#f2faf4" stroke="#3f9a5c" stroke-width="1.5"/>
<text x="1318" y="508" font-size="15" font-weight="700" fill="#222">OpenSearch</text>
<text x="1318" y="530" font-size="12.5" fill="#555">Geo index, facets, autocomplete</text>
<text x="1318" y="548" font-size="12.5" fill="#555">Owner: Search (fed by events)</text>
<rect x="1300" y="578" width="260" height="86" rx="12" fill="#f2faf4" stroke="#3f9a5c" stroke-width="1.5"/>
<text x="1318" y="606" font-size="15" font-weight="700" fill="#222">Object storage (S3)</text>
<text x="1318" y="628" font-size="12.5" fill="#555">Photo originals → image CDN</text>
<text x="1318" y="646" font-size="12.5" fill="#555">Owner: Listing media pipeline</text>
<rect x="1300" y="676" width="260" height="86" rx="12" fill="#f2faf4" stroke="#3f9a5c" stroke-width="1.5"/>
<text x="1318" y="704" font-size="15" font-weight="700" fill="#222">Wide-column store</text>
<text x="1318" y="726" font-size="12.5" fill="#555">Messages, review text, activity</text>
<text x="1318" y="744" font-size="12.5" fill="#555">Owner: Messaging, Reviews</text>
<rect x="590" y="600" width="680" height="118" rx="12" fill="#fff8ec" stroke="#d99a2b" stroke-width="1.5"/>
<text x="608" y="628" font-size="15" font-weight="700" fill="#222">Event bus (Kafka) + workers</text>
<text x="608" y="650" font-size="12.5" fill="#555">Outbox/CDC from Postgres → listing.updated, availability.changed, booking.confirmed, review.created</text>
<text x="608" y="668" font-size="12.5" fill="#555">Consumers: search indexer (near-real-time), cache purge + ISR revalidate, notifications, payouts,</text>
<text x="608" y="686" font-size="12.5" fill="#555">image pipeline (resize / moderate), analytics sink. At-least-once + idempotent handlers, DLQs.</text>
<rect x="40" y="600" width="510" height="118" rx="12" fill="#f2faf4" stroke="#3f9a5c" stroke-width="1.5"/>
<text x="58" y="628" font-size="15" font-weight="700" fill="#222">Analytics &amp; ML</text>
<text x="58" y="650" font-size="12.5" fill="#555">Data lake + warehouse, feature store; offline training for</text>
<text x="58" y="668" font-size="12.5" fill="#555">search ranking, pricing suggestions and fraud scoring;</text>
<text x="58" y="686" font-size="12.5" fill="#555">online inference behind the Search / Pricing services.</text>
<rect x="40" y="822" width="291.2" height="196" rx="12" fill="#fafafa" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="58" y="850" font-size="15" font-weight="700" fill="#222">Frontend</text>
<text x="58" y="872" font-size="12.5" fill="#555">ISR HTML cached at the edge;</text>
<text x="58" y="891" font-size="12.5" fill="#555">revalidated by listing events</text>
<text x="58" y="910" font-size="12.5" fill="#555">Image CDN + srcset (LCP image</text>
<text x="58" y="929" font-size="12.5" fill="#555">preloaded, rest lazy)</text>
<text x="58" y="948" font-size="12.5" fill="#555">Overlays code-split; URL-</text>
<text x="58" y="967" font-size="12.5" fill="#555">addressable (?modal=…)</text>
<text x="58" y="986" font-size="12.5" fill="#555">RUM Core Web Vitals budgets</text>
<rect x="347.2" y="822" width="291.2" height="196" rx="12" fill="#fafafa" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="365.2" y="850" font-size="15" font-weight="700" fill="#222">Backend</text>
<text x="365.2" y="872" font-size="12.5" fill="#555">Stateless services, HPA on</text>
<text x="365.2" y="891" font-size="12.5" fill="#555">CPU / RPS; BFF fan-out</text>
<text x="365.2" y="910" font-size="12.5" fill="#555">Rate limits + idempotency keys</text>
<text x="365.2" y="929" font-size="12.5" fill="#555">Booking = saga with holds (TTL)</text>
<text x="365.2" y="948" font-size="12.5" fill="#555">Queue-based load levelling</text>
<text x="365.2" y="967" font-size="12.5" fill="#555">for launch / holiday spikes</text>
<text x="365.2" y="986" font-size="12.5" fill="#555">Split services only on measured</text>
<text x="365.2" y="1005" font-size="12.5" fill="#555">bottlenecks</text>
<rect x="654.4" y="822" width="291.2" height="196" rx="12" fill="#fafafa" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="672.4" y="850" font-size="15" font-weight="700" fill="#222">Storage</text>
<text x="672.4" y="872" font-size="12.5" fill="#555">Postgres sharded by listing_id,</text>
<text x="672.4" y="891" font-size="12.5" fill="#555">regional read replicas</text>
<text x="672.4" y="910" font-size="12.5" fill="#555">Bookings pinned to a home region;</text>
<text x="672.4" y="929" font-size="12.5" fill="#555">exclusion constraint = no</text>
<text x="672.4" y="948" font-size="12.5" fill="#555">double booking</text>
<text x="672.4" y="967" font-size="12.5" fill="#555">Redis read-through for hot</text>
<text x="672.4" y="986" font-size="12.5" fill="#555">listings; S3 + lifecycle tiers</text>
<rect x="961.5999999999999" y="822" width="291.2" height="196" rx="12" fill="#fafafa" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="979.5999999999999" y="850" font-size="15" font-weight="700" fill="#222">Search</text>
<text x="979.5999999999999" y="872" font-size="12.5" fill="#555">OpenSearch shards per region;</text>
<text x="979.5999999999999" y="891" font-size="12.5" fill="#555">rebuilt from events, never the</text>
<text x="979.5999999999999" y="910" font-size="12.5" fill="#555">source of truth</text>
<text x="979.5999999999999" y="929" font-size="12.5" fill="#555">Near-real-time indexing via CDC</text>
<text x="979.5999999999999" y="948" font-size="12.5" fill="#555">Availability re-checked on the</text>
<text x="979.5999999999999" y="967" font-size="12.5" fill="#555">booking path</text>
<text x="979.5999999999999" y="986" font-size="12.5" fill="#555">ML re-rank inside Search service</text>
<rect x="1268.8" y="822" width="291.2" height="196" rx="12" fill="#fafafa" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="1286.8" y="850" font-size="15" font-weight="700" fill="#222">Deployment</text>
<text x="1286.8" y="872" font-size="12.5" fill="#555">Frontend: CDN/Vercel, preview</text>
<text x="1286.8" y="891" font-size="12.5" fill="#555">deploy per PR</text>
<text x="1286.8" y="910" font-size="12.5" fill="#555">Services: GitHub Actions → image</text>
<text x="1286.8" y="929" font-size="12.5" fill="#555">→ Argo CD canary, SLO auto-rollback</text>
<text x="1286.8" y="948" font-size="12.5" fill="#555">Terraform; multi-region active-</text>
<text x="1286.8" y="967" font-size="12.5" fill="#555">active reads, DR replicas</text>
<text x="1286.8" y="986" font-size="12.5" fill="#555">OpenTelemetry traces + SLOs</text>
<rect x="40" y="1060" width="1520" height="110" rx="12" fill="#ffffff" stroke="#ff385c" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="58" y="1088" font-size="15" font-weight="700" fill="#222">Where this take-home sits</text>
<text x="58" y="1110" font-size="12.5" fill="#555">The clone is the "Web" client's listing page: a static React SPA (Vite) served from a CDN (Vercel). Listing data lives in src/data/listing.js, shaped like the</text>
<text x="58" y="1128" font-size="12.5" fill="#555">Listing / Reviews / Availability responses a BFF would return, so swapping it for a fetch is a local change. Photo tour and lightbox state is URL-addressable</text>
<text x="58" y="1146" font-size="12.5" fill="#555">(?modal=PHOTO_TOUR_SCROLLABLE&amp;modalItem=…), which is what lets SSR/ISR render the same overlay deep links and the CDN cache them per URL.</text>
